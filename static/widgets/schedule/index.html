<section class="card schedule-card draggable-widget" id="widget-schedule" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>

  <div class="card-head">
    <div class="schedule-header-left">
      <h3 class="card-label">Timeline Schedule</h3>
      <span class="schedule-subtitle">Multi-Day Task Overview</span>
    </div>
    <div class="schedule-nav">
      <span class="sched-arrow" id="sched-prev">← Prev</span>
      <span class="sched-month">August 2026</span>
      <span class="sched-arrow" id="sched-next">Next →</span>
    </div>
  </div>

  <div class="timeline-container">
    <!-- X-AXIS: DATES HEADER -->
    <div class="timeline-x-axis">
      <div class="timeline-date-cell"><span class="day-name">Mon</span><span class="day-num">10</span></div>
      <div class="timeline-date-cell active"><span class="day-name">Tue</span><span class="day-num">11</span></div>
      <div class="timeline-date-cell"><span class="day-name">Wed</span><span class="day-num">12</span></div>
      <div class="timeline-date-cell"><span class="day-name">Thu</span><span class="day-num">13</span></div>
      <div class="timeline-date-cell"><span class="day-name">Fri</span><span class="day-num">14</span></div>
      <div class="timeline-date-cell"><span class="day-name">Sat</span><span class="day-num">15</span></div>
      <div class="timeline-date-cell"><span class="day-name">Sun</span><span class="day-num">16</span></div>
    </div>

    <!-- Y-AXIS ROWS (UNLABELED Y-AXIS) WITH MULTI-DAY TASK BARS -->
    <div class="timeline-body">
      <!-- Grid background guidelines for dates -->
      <div class="timeline-grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line active-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
      </div>

      <!-- Row 1: Task Type 1 (spanning Aug 10 to Aug 13) -->
      <div class="timeline-row">
        <div class="timeline-bar-wrapper" style="left: 0%; width: 57.14%;">
          <div class="timeline-bar dark" data-task="Sprint Sync & UI Redesign" data-span="Aug 10 - Aug 13">
            <span class="bar-dot amber"></span>
            <span class="bar-title">Sprint Sync & UI Redesign</span>
            <span class="bar-tag">4 Days</span>
          </div>
        </div>
      </div>

      <!-- Row 2: Task Type 2 (spanning Aug 11 to Aug 15) -->
      <div class="timeline-row">
        <div class="timeline-bar-wrapper" style="left: 14.28%; width: 71.42%;">
          <div class="timeline-bar amber" data-task="API Endpoints & Integration" data-span="Aug 11 - Aug 15">
            <span class="bar-title">API Endpoints & Integration</span>
            <span class="bar-tag dark">5 Days</span>
          </div>
        </div>
      </div>

      <!-- Row 3: Task Type 3 (spanning Aug 12 to Aug 14) -->
      <div class="timeline-row">
        <div class="timeline-bar-wrapper" style="left: 28.57%; width: 42.85%;">
          <div class="timeline-bar light" data-task="Client Feedback & QA Walkthrough" data-span="Aug 12 - Aug 14">
            <span class="bar-title">Client Feedback & QA Walkthrough</span>
            <span class="bar-tag focus">3 Days</span>
          </div>
        </div>
      </div>

      <!-- Row 4: Task Type 4 (spanning Aug 10 to Aug 16) -->
      <div class="timeline-row">
        <div class="timeline-bar-wrapper" style="left: 0%; width: 100%;">
          <div class="timeline-bar muted" data-task="Daily Habit & Health Tracking" data-span="Aug 10 - Aug 16">
            <span class="bar-title">Daily Habit & Health Tracking</span>
            <span class="bar-tag">7 Days</span>
          </div>
        </div>
      </div>

      <!-- Row 5: Task Type 5 (spanning Aug 14 to Aug 16) -->
      <div class="timeline-row">
        <div class="timeline-bar-wrapper" style="left: 57.14%; width: 42.85%;">
          <div class="timeline-bar green" data-task="Staging Release & Production Launch" data-span="Aug 14 - Aug 16">
            <span class="bar-title">Staging Release & Production Launch</span>
            <span class="bar-tag">3 Days</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
