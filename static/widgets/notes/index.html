<section class="card notes-card draggable-widget" id="widget-notes" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>
  <div class="card-head">
    <h3 class="card-label">Quick Notes</h3>
  </div>
  <div class="notes-body">
    <textarea id="notes-textarea" class="notes-textarea" placeholder="Jot down quick ideas, links, or draft notes..."></textarea>
    <div class="notes-footer">
      <button id="btn-save-notes" class="btn-save-notes">Save Note</button>
    </div>
  </div>
</section>
