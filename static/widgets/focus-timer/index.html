<section class="card focus-timer-card draggable-widget" id="widget-focus-timer" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>
  <div class="card-head">
    <h3 class="card-label">Focus Timer</h3>
    <div class="timer-modes">
      <button class="timer-mode-btn active" data-mode="focus">25m Focus</button>
      <button class="timer-mode-btn" data-mode="break">5m Break</button>
    </div>
    <button class="btn-reset-timer" id="btn-reset-timer" title="Reset Timer">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>
  </div>
  <div class="timer-clock-wrap">
    <div class="timer-svg-box">
      <svg viewBox="0 0 36 36" class="timer-svg">
        <path class="timer-bg-path" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
        <path id="widget-timer-arc" class="timer-arc-path" stroke-dasharray="100, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
      </svg>
      <div class="timer-center-text">
        <span id="widget-timer-display" class="timer-digits">25:00</span>
        <span id="widget-timer-status" class="timer-label">DEEP WORK</span>
      </div>
    </div>
  </div>
  <div class="timer-footer">
    <div class="timer-controls">
      <button id="widget-btn-play" class="timer-btn-primary" title="Start/Pause">
        <svg id="widget-play-icon" width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
      </button>
      <button id="widget-btn-pause" class="timer-btn-secondary" title="Pause">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5 0a1 1 0 012 0v4a1 1 0 11-2 0V8z" clip-rule="evenodd"/></svg>
      </button>
    </div>
    <span class="session-badge">Session #3</span>
  </div>
</section>
