<section class="card analytics-tracker-card draggable-widget" id="widget-analytics-tracker" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>

  <div class="at-header">
    <div class="at-brand">
      <span class="at-brand-dot"></span>
      <span class="at-brand-name">Analytics Tracker</span>
    </div>
    <div class="at-metrics">
      <div class="at-metric">
        <span class="at-metric-val" id="metric1-val">09.45</span>
        <span class="at-metric-unit">AM</span>
        <span class="at-metric-badge">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
          30min
        </span>
      </div>
      <div class="at-metric">
        <span class="at-metric-val" id="metric2-val">98.57°</span>
        <span class="at-metric-badge">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          0.7%
        </span>
      </div>
    </div>
  </div>

  <div class="at-chart" id="chart-wrapper">
    <div class="at-tooltip hidden" id="chart-tooltip">
      <div class="at-tooltip-body">
        <span class="at-tooltip-dot" id="tooltip-dot"></span>
        <span id="tooltip-text">0.00%</span>
      </div>
      <span class="at-tooltip-arrow"></span>
    </div>

    <div class="at-bars-area">
      <div class="at-axis">
        <span>1.0%</span>
        <span>0.5%</span>
        <span>0.0%</span>
      </div>
      <div class="at-bars" id="bars-container"></div>
    </div>

    <div class="at-xaxis">
      <span>Jan</span>
      <span>Mar</span>
      <span>May</span>
      <span>Jul</span>
    </div>
  </div>

  <div class="at-tabs">
    <button class="at-tab active" data-tab="Tracker">Tracker</button>
    <button class="at-tab" data-tab="MedicalAnalytics">MedicalAnalytics</button>
    <button class="at-tab" data-tab="FitnessMetrics">FitnessMetrics</button>
    <button class="at-tab" data-tab="PatientInsights">PatientInsights</button>
    <button class="at-tab" data-tab="AI Healthcare">AI Healthcare</button>
  </div>

  <div class="at-toast" id="widget-toast-msg">Tab updated</div>
</section>
