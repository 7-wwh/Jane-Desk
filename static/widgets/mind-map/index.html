<section class="card work-card tree-card draggable-widget" id="widget-mind-map" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>
  <div class="card-head">
    <div class="card-head-actions">
      <h3 class="card-label">Mind Map <span class="mono-mute" id="tree-count"></span></h3>
      <button class="btn btn-sm" id="work-tree-toggle" type="button" data-action="tree-toggle">Collapse</button>
    </div>
    <div class="mm-actions">
      <button class="mm-btn" id="mm-reset" type="button">Reset view</button>
      <span class="overflow" aria-hidden="true">&#8943;</span>
    </div>
  </div>
  <div id="work-tree">
    <div class="mm-hint">Scroll to zoom · drag to pan · click nodes to expand</div>
  </div>
</section>
