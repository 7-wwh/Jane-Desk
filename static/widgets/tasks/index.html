<section class="card work-card projects-card draggable-widget" id="widget-tasks" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>
  <div class="card-head">
    <h3 class="card-label">Tasks <span class="mono-mute" id="work-projects-count"></span></h3>
    <div class="segmented" id="work-sort">
      <button class="seg-btn" data-value="deadline">Deadline</button>
      <button class="seg-btn" data-value="alpha">A-Z</button>
      <button class="seg-btn" data-value="priority">Priority</button>
    </div>
  </div>
  <div id="work-projects"></div>
</section>
