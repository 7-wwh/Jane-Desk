<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks Widget</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#F5C200',
                        darkCard: '#151518',
                        darkCardBorder: '#26262a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        display: ['Unbounded', 'Chakra Petch', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@800;900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Custom smooth scrollbar matching Focus Timer */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 9999px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #F5C200;
        }

        /* Smooth Task Strike Animation */
        .task-text {
            transition: color 0.2s ease, text-decoration-color 0.2s ease, opacity 0.2s ease;
        }

        .task-item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .task-item-card:hover {
            transform: translateX(2px);
        }

        /* Active Tag Pill Scale Effects */
        .filter-btn-active {
            background-color: #18181b !important;
            color: #F5C200 !important;
            font-weight: 800 !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transform: scale(1.04);
        }

        .filter-btn-inactive {
            background-color: rgba(229, 231, 235, 0.8) !important;
            color: #52525b !important;
            font-weight: 600 !important;
        }

        .filter-btn-inactive:hover {
            background-color: #d4d4d8 !important;
            color: #18181b !important;
        }

        /* Custom check scale effect */
        .check-anim {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
        }

        .task-item-card:active .check-anim {
            transform: scale(0.9);
        }

        /* Tactile Directional Tab Slide Animations (Slower, Springy Physics) */
        @keyframes slideOutLeft {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
                filter: blur(0px);
            }

            100% {
                transform: translateX(-45%) scale(0.95);
                opacity: 0;
                filter: blur(1.5px);
            }
        }

        @keyframes slideInRight {
            0% {
                transform: translateX(45%) scale(0.95);
                opacity: 0;
                filter: blur(1.5px);
            }

            70% {
                transform: translateX(-2%) scale(1.01);
                opacity: 1;
                filter: blur(0px);
            }

            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
        }

        @keyframes slideOutRight {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
                filter: blur(0px);
            }

            100% {
                transform: translateX(45%) scale(0.95);
                opacity: 0;
                filter: blur(1.5px);
            }
        }

        @keyframes slideInLeft {
            0% {
                transform: translateX(-45%) scale(0.95);
                opacity: 0;
                filter: blur(1.5px);
            }

            70% {
                transform: translateX(2%) scale(1.01);
                opacity: 1;
                filter: blur(0px);
            }

            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
        }

        .slide-out-left {
            animation: slideOutLeft 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .slide-in-right {
            animation: slideInRight 0.38s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
        }

        .slide-out-right {
            animation: slideOutRight 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .slide-in-left {
            animation: slideInLeft 0.38s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
        }

        .task-morph-container {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .task-morph-btn-text {
            transition: opacity 0.2s ease-out, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s ease-out;
        }

        .task-morph-input {
            transition: opacity 0.22s ease-out, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease-out;
        }

        .is-editing {
            box-shadow: 0 0 14px rgba(245, 194, 0, 0.4);
            background-color: #F5C200 !important;
        }

        .is-editing .task-morph-btn-text {
            opacity: 0;
            transform: scale(0.88) translateY(3px);
            filter: blur(2px);
            pointer-events: none;
        }

        .is-editing .task-morph-input {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0px);
            pointer-events: auto;
        }
    </style>
</head>

<body class="bg-stone-200/60 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- MAIN TASK WIDGET CONTAINER -->
    <div id="widget-tasks" draggable="true" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)"
        ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)" ondragend="handleDragEnd(event)"
        class="draggable-widget bg-stone-100/95 backdrop-blur-md w-full max-w-sm h-[520px] rounded-[2.2rem] p-5 border border-stone-300/80 flex flex-col justify-between shadow-sm relative group transition-all duration-200 overflow-visible">

        <!-- Drag Handle Indicator -->
        <div class="drag-handle absolute top-2.5 right-3 opacity-0 group-hover:opacity-100 transition-opacity bg-stone-200/90 p-1 rounded-md cursor-grab active:cursor-grabbing z-40"
            title="Drag to rearrange widget">
            <svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path>
            </svg>
        </div>

        <!-- Upper Task Progress Header Section -->
        <div class="pr-5">
            <div class="flex items-center justify-between mb-2">
                <div>
                    <div class="text-[11px] font-black uppercase tracking-widest text-stone-500">Active Tasks</div>
                    <div class="text-[10px] text-stone-400 font-semibold mt-0.5" id="date-label">Today • Focus Mode
                    </div>
                </div>
            </div>

            <!-- Segmented Dynamic Progress Bar -->
            <div class="flex gap-1.5 my-3" id="segmented-progress-bar">
                <!-- Segment elements generated dynamically by JS -->
            </div>

            <!-- Filter Category Tags -->
            <div class="task-filters flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                <button class="task-filter-btn px-3 py-1 rounded-full text-[10px] filter-btn-active transition-all"
                    onclick="filterTasks('all', this)">
                    Today's
                </button>
                <button class="task-filter-btn px-3 py-1 rounded-full text-[10px] filter-btn-inactive transition-all"
                    onclick="filterTasks('Work', this)">
                    #Work
                </button>
                <button class="task-filter-btn px-3 py-1 rounded-full text-[10px] filter-btn-inactive transition-all"
                    onclick="filterTasks('Personal', this)">
                    #Personal
                </button>
                <button class="task-filter-btn px-3 py-1 rounded-full text-[10px] filter-btn-inactive transition-all"
                    onclick="filterTasks('Health', this)">
                    #Health
                </button>
            </div>
        </div>

        <!-- Dark Card Container for Task Items -->
        <div
            class="mt-2 bg-darkCard text-white rounded-3xl p-3.5 shadow-inner border border-darkCardBorder relative z-10 flex flex-col justify-between flex-1 overflow-hidden">

            <!-- Overflow Viewport Wrapper for Directional Slide Transitions -->
            <div class="relative h-full overflow-hidden w-full flex-1 min-h-[220px]">
                <!-- Task Scroll List Viewport -->
                <div class="space-y-2 h-full overflow-y-auto pr-1 custom-scrollbar w-full" id="task-list">
                    <!-- Task item rows injected dynamically via JavaScript -->
                </div>
            </div>

            <!-- Quick Add Input & Counter Container inside Black Box -->
            <div class="pt-2.5 mt-2 border-t border-stone-800/80 flex items-center gap-2">
                <!-- Solid Yellow Dynamic Add Task Morph Container -->
                <div id="add-task-container" onclick="activateTaskInput()"
                    class="task-morph-container flex-1 h-9 relative bg-brandYellow hover:bg-amber-400 rounded-xl overflow-hidden cursor-pointer shadow-sm flex items-center">

                    <!-- State 1: Solid Yellow Button Overlay -->
                    <div id="add-task-btn"
                        class="task-morph-btn-text absolute inset-0 flex items-center justify-center gap-1.5 text-stone-950 font-extrabold text-xs select-none px-3.5">
                        <svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>Add Task</span>
                    </div>

                    <!-- State 2: Text Type Input Box Overlay -->
                    <input type="text" id="new-task-input" placeholder="+ Add task..."
                        class="task-morph-input w-full h-full bg-transparent text-stone-950 font-extrabold placeholder-stone-800/70 text-xs px-3.5 focus:outline-none opacity-0 scale-95 translate-y-[-2px] pointer-events-none"
                        onkeydown="handleInputKeyDown(event)" onblur="handleInputBlur(event)"
                        onclick="event.stopPropagation()">
                </div>

                <!-- Task Counter Badge alongside Add Task -->
                <span id="status-badge"
                    class="text-xs font-black text-brandYellow bg-stone-900 border border-stone-800 px-3 h-9 flex items-center justify-center rounded-xl transition-all duration-300 shrink-0 min-w-[50px] text-center shadow-inner">
                    0/0
                </span>
            </div>
        </div>

    </div>

    <script>
        // State Management
        let tasks = [
            { id: 1, title: 'Review Q3 UX Wireframes', category: 'Work', time: '09:00 AM', completed: true, icon: 'code' },
            { id: 2, title: '30-Min Cardio & Run', category: 'Health', time: '10:30 AM', completed: true, icon: 'lightning' },
            { id: 3, title: 'Update API Docs & Endpoints', category: 'Work', time: '02:00 PM', completed: false, icon: 'chat' },
            { id: 4, title: 'Order Desk Cable Management', category: 'Personal', time: '04:30 PM', completed: false, icon: 'cart' },
            { id: 5, title: 'Evening Mindfulness Session', category: 'Health', time: '08:00 PM', completed: false, icon: 'sun' }
        ];

        let currentFilter = 'all';
        let isAnimatingTab = false;
        const filterOrder = ['all', 'Work', 'Personal', 'Health'];

        // DOM Element Cache
        const widgetTasks = document.getElementById('widget-tasks');
        const taskListEl = document.getElementById('task-list');
        const segmentedProgressBarEl = document.getElementById('segmented-progress-bar');
        const statusBadgeEl = document.getElementById('status-badge');
        const dateLabelEl = document.getElementById('date-label');
        const addTaskContainer = document.getElementById('add-task-container');
        const addTaskBtn = document.getElementById('add-task-btn');
        const newTaskInput = document.getElementById('new-task-input');

        // SVG Icons Mapping
        const icons = {
            code: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
            lightning: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
            chat: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
            cart: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`,
            sun: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`
        };

        // Render Task List
        function renderTasks() {
            taskListEl.innerHTML = '';

            const filtered = currentFilter === 'all'
                ? tasks
                : tasks.filter(t => t.category.toLowerCase() === currentFilter.toLowerCase());

            if (filtered.length === 0) {
                const filterLabel = currentFilter === 'all' ? "Today's" : `#${currentFilter}`;
                taskListEl.innerHTML = `
                    <div class="h-full min-h-[180px] flex items-center justify-center text-center text-stone-500 text-xs italic">
                        No tasks in ${filterLabel}
                    </div>`;
            } else {
                filtered.forEach(task => {
                    const iconSvg = icons[task.icon] || icons.chat;

                    const item = document.createElement('div');
                    item.className = `task-item-card group flex items-center justify-between p-2 rounded-xl hover:bg-white/5 cursor-pointer select-none transition-all border border-transparent hover:border-stone-800`;
                    item.onclick = () => toggleTask(task.id);

                    item.innerHTML = `
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <div class="w-6 h-6 rounded-lg bg-stone-900 border border-stone-800 flex items-center justify-center text-stone-400 group-hover:text-stone-200 transition-colors flex-shrink-0">
                                ${iconSvg}
                            </div>
                            <div class="truncate">
                                <div class="text-xs font-semibold ${task.completed ? 'line-through text-stone-500 opacity-60' : 'text-stone-100'} task-text truncate">
                                    ${escapeHtml(task.title)}
                                </div>
                                <div class="text-[9px] font-medium text-stone-500">
                                    ${task.time} · <span class="text-stone-400">#${task.category}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 flex-shrink-0 ml-2">
                            <button onclick="event.stopPropagation(); deleteTask(${task.id})" class="opacity-0 group-hover:opacity-100 text-stone-600 hover:text-red-400 p-1 transition-opacity" title="Delete Task">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>

                            <div class="task-check check-anim w-4 h-4 rounded-full ${task.completed ? 'bg-brandYellow text-stone-900' : 'bg-stone-900 border border-stone-700'} flex items-center justify-center">
                                ${task.completed ? `
                                    <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>` : ''}
                            </div>
                        </div>
                    `;

                    taskListEl.appendChild(item);
                });
            }

            updateMetrics();
        }

        // Update Counter and Segmented Progress Bar
        function updateMetrics() {
            const total = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            const ratio = total > 0 ? completedCount / total : 0;

            // Counter Update in Status Badge
            statusBadgeEl.textContent = `${completedCount}/${total}`;

            // Dynamic Segmented Progress Bar
            segmentedProgressBarEl.innerHTML = '';

            // Create segments proportional to task count
            const segmentsCount = Math.max(3, Math.min(total, 6));

            for (let i = 0; i < segmentsCount; i++) {
                const segRatio = (i + 1) / segmentsCount;
                const seg = document.createElement('div');
                seg.className = 'h-2 flex-1 rounded-full transition-all duration-300';

                if (ratio >= segRatio) {
                    seg.classList.add('bg-brandYellow');
                } else if (ratio > (i / segmentsCount)) {
                    seg.classList.add('bg-stone-800');
                } else {
                    seg.classList.add('bg-stone-300');
                }

                segmentedProgressBarEl.appendChild(seg);
            }
        }

        // Dynamic Add Task Morph State Transitions
        function activateTaskInput() {
            if (addTaskContainer.classList.contains('is-editing')) return;

            addTaskContainer.classList.add('is-editing');
            setTimeout(() => {
                newTaskInput.focus();
            }, 60);
        }

        function deactivateTaskInput() {
            newTaskInput.value = '';
            addTaskContainer.classList.remove('is-editing');
            newTaskInput.blur();
        }

        function handleInputKeyDown(e) {
            if (e.key === 'Enter') {
                handleAddTask();
            } else if (e.key === 'Escape') {
                deactivateTaskInput();
            }
        }

        function handleInputBlur(e) {
            if (newTaskInput.value.trim() !== '') {
                handleAddTask();
            } else {
                deactivateTaskInput();
            }
        }

        function handleAddTask() {
            const title = newTaskInput.value.trim();
            if (!title) {
                deactivateTaskInput();
                return;
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Assign category based on active filter, or default to Work
            const category = (currentFilter && currentFilter !== 'all') ? currentFilter : 'Work';

            const newTask = {
                id: Date.now(),
                title: title,
                category: category,
                time: timeStr,
                completed: false,
                icon: 'chat'
            };

            tasks.push(newTask);
            deactivateTaskInput();
            renderTasks();

            // Scroll to bottom of task list to show new item
            setTimeout(() => {
                taskListEl.scrollTop = taskListEl.scrollHeight;
            }, 50);
        }

        // Task Interactions
        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTasks();
        }

        function filterTasks(category, btn) {
            if (category === currentFilter || isAnimatingTab) return;

            const oldIndex = filterOrder.indexOf(currentFilter);
            const newIndex = filterOrder.indexOf(category);

            // Determine directional movement
            const direction = newIndex > oldIndex ? 'left' : 'right';

            currentFilter = category;

            // Update Tab Highlight Styling
            document.querySelectorAll('.task-filter-btn').forEach(b => {
                b.className = 'task-filter-btn px-3 py-1 rounded-full text-[10px] filter-btn-inactive transition-all duration-300 transform active:scale-90';
            });
            btn.className = 'task-filter-btn px-3 py-1 rounded-full text-[10px] filter-btn-active transition-all duration-300 transform active:scale-95';

            // Trigger Directional Slide Motion
            isAnimatingTab = true;
            const exitClass = direction === 'left' ? 'slide-out-left' : 'slide-out-right';
            const enterClass = direction === 'left' ? 'slide-in-right' : 'slide-in-left';

            taskListEl.classList.add(exitClass);

            const exitDuration = 240;
            const enterDuration = 380;

            setTimeout(() => {
                taskListEl.classList.remove(exitClass);
                renderTasks();
                taskListEl.classList.add(enterClass);

                setTimeout(() => {
                    taskListEl.classList.remove(enterClass);
                    isAnimatingTab = false;
                }, enterDuration);
            }, exitDuration);
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Drag & Drop Handlers for Widget Rearrangement
        function handleDragStart(e) {
            e.target.classList.add('opacity-50', 'scale-[0.98]');
            e.dataTransfer.setData('text/plain', 'widget-tasks');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDragLeave(e) { }

        function handleDrop(e) {
            e.preventDefault();
        }

        function handleDragEnd(e) {
            e.target.classList.remove('opacity-50', 'scale-[0.98]');
        }

        // Initialization
        window.onload = () => {
            // Set current date display
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            dateLabelEl.textContent = `${new Date().toLocaleDateString('en-US', options)} • Focus Mode`;

            renderTasks();
        };
    </script>
</body>

</html>
