<div class="draggable-widget bg-stone-100/90 rounded-3xl p-5 border border-stone-200/70 flex flex-col justify-between shadow-sm relative group transition-all duration-200" draggable="true" ondragend="handleDragEnd(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)" ondragover="handleDragOver(event)" ondragstart="handleDragStart(event)" ondrop="handleDrop(event)">
<div class="drag-handle absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity bg-stone-200/80 p-1 rounded-md cursor-grab active:cursor-grabbing z-20" title="Drag to rearrange">
<svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M4 8h16M4 16h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<div class="flex items-start justify-between pr-6">
<div>
<div class="text-sm font-bold text-stone-700">Focus Timer</div>
<div class="flex gap-1.5 mt-1">
<button class="timer-mode-btn bg-stone-900 text-white text-[10px] font-bold px-2 py-0.5 rounded-full transition-all" onclick="setTimerMode('focus', this)">25m Focus</button>
<button class="timer-mode-btn bg-stone-200/80 text-stone-700 text-[10px] font-semibold px-2 py-0.5 rounded-full hover:bg-stone-300 transition-all" onclick="setTimerMode('shortBreak', this)">5m Break</button>
</div>
</div>
<button class="w-8 h-8 rounded-full bg-white border border-stone-200 flex items-center justify-center text-stone-600 hover:bg-stone-50 transition-colors shadow-sm" onclick="resetTimer()" title="Reset Timer">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
<!-- Circular Clock Display -->
<div class="my-1 flex flex-col items-center justify-center relative">
<div class="relative w-28 h-28 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<path class="text-stone-200" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3.5"></path>
<path class="text-[#F5C200] transition-all duration-500" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" id="timer-arc" stroke="currentColor" stroke-dasharray="100, 100" stroke-linecap="round" stroke-width="3.5"></path>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="text-2xl font-black text-stone-900 tracking-tight" id="timer-display">25:00</span>
<span class="text-[10px] text-stone-500 font-bold uppercase tracking-wider" id="timer-status-label">Deep Work</span>
</div>
</div>
</div>
<!-- Timer Controls Bar -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<button class="w-9 h-9 rounded-full bg-stone-900 text-white flex items-center justify-center hover:bg-stone-800 shadow-sm transition-transform active:scale-95" id="btn-play" onclick="toggleTimer()" title="Start/Pause">
<svg class="w-4 h-4 ml-0.5" fill="currentColor" id="play-icon" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" fill-rule="evenodd"></path></svg>
</button>
<button class="w-9 h-9 rounded-full bg-white border border-stone-200 flex items-center justify-center text-stone-800 hover:bg-stone-50 shadow-sm transition-transform active:scale-95" onclick="pauseTimer()" title="Pause">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 20 20"><path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5 0a1 1 0 012 0v4a1 1 0 11-2 0V8z" fill-rule="evenodd"></path></svg>
</button>
</div>
<span class="text-[11px] font-bold text-stone-500 bg-stone-200/60 px-2.5 py-1 rounded-full">Session #3</span>
</div>
</div>
