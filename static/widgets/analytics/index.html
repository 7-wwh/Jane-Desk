<section class="card analytics-card draggable-widget" id="widget-analytics" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>
  <div class="card-head">
    <div>
      <h3 class="card-label">Weekly Output</h3>
      <div class="analytics-stat-row">
        <span class="analytics-number">32.4 h</span>
        <span class="analytics-subtext">Focus time this week</span>
      </div>
    </div>
    <button class="btn-analytics-breakdown" id="btn-analytics-breakdown" title="View breakdown">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
    </button>
  </div>

  <div class="bar-chart-container">
    <div class="today-badge">6.5h today</div>
    
    <div class="chart-bars">
      <div class="chart-col" data-day="Sunday" data-hours="1.5">
        <div class="bar-track"><div class="bar-fill" style="height: 25%;"></div></div>
        <span class="day-label">S</span>
      </div>
      <div class="chart-col" data-day="Monday" data-hours="5.2">
        <div class="bar-track"><div class="bar-fill active-dark" style="height: 65%;"></div></div>
        <span class="day-label">M</span>
      </div>
      <div class="chart-col" data-day="Tuesday" data-hours="6.5">
        <div class="bar-track"><div class="bar-fill highlight" style="height: 85%;"></div></div>
        <span class="day-label today">T</span>
      </div>
      <div class="chart-col" data-day="Wednesday" data-hours="4.0">
        <div class="bar-track"><div class="bar-fill" style="height: 45%;"></div></div>
        <span class="day-label">W</span>
      </div>
      <div class="chart-col" data-day="Thursday" data-hours="5.0">
        <div class="bar-track"><div class="bar-fill" style="height: 60%;"></div></div>
        <span class="day-label">T</span>
      </div>
      <div class="chart-col" data-day="Friday" data-hours="4.5">
        <div class="bar-track"><div class="bar-fill" style="height: 50%;"></div></div>
        <span class="day-label">F</span>
      </div>
      <div class="chart-col" data-day="Saturday" data-hours="2.0">
        <div class="bar-track"><div class="bar-fill" style="height: 30%;"></div></div>
        <span class="day-label">S</span>
      </div>
    </div>
  </div>
</section>
