<section class="card habits-card draggable-widget" id="widget-habits" draggable="true">
  <div class="drag-handle" title="Drag to rearrange" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/></svg>
  </div>
  <div class="card-head">
    <h3 class="card-label">Daily Habits</h3>
    <span class="badge-habits-score" id="habits-score">80%</span>
  </div>

  <div class="habits-list">
    <div class="habit-item done" data-habit="water">
      <div class="habit-info">
        <span class="habit-icon">💧</span>
        <span class="habit-name">Drink 2.5L Water</span>
      </div>
      <span class="habit-status-pill">✓ Done</span>
    </div>

    <div class="habit-item done" data-habit="reading">
      <div class="habit-info">
        <span class="habit-icon">📚</span>
        <span class="habit-name">Read 20 Pages</span>
      </div>
      <span class="habit-status-pill">✓ Done</span>
    </div>

    <div class="habit-item" data-habit="meditation">
      <div class="habit-info">
        <span class="habit-icon">🧘</span>
        <span class="habit-name">10-Min Meditation</span>
      </div>
      <span class="habit-status-pill">Pending</span>
    </div>
  </div>
</section>
