<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECK BOX — Life at a glance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23F5C200'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 6' fill='none' stroke='%231A1714' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core.css">
  <link rel="stylesheet" href="widgets/mind-map/widget.css">
  <link rel="stylesheet" href="widgets/current-task/widget.css">
  <link rel="stylesheet" href="widgets/tasks/widget.css">
  <link rel="stylesheet" href="widgets/upcoming/widget.css">
  <link rel="stylesheet" href="widgets/ideas/widget.css">
  <link rel="stylesheet" href="widgets/settings/widget.css">
  <link rel="stylesheet" href="widgets/quick-add/widget.css">
  <link rel="stylesheet" href="widgets/sessions/widget.css">
  <link rel="stylesheet" href="widgets/focus-timer/widget.css">
  <link rel="stylesheet" href="widgets/analytics/widget.css">
  <link rel="stylesheet" href="widgets/habits/widget.css">
  <link rel="stylesheet" href="widgets/projects-overview/widget.css">
  <link rel="stylesheet" href="widgets/schedule/widget.css">
  <link rel="stylesheet" href="widgets/notes/widget.css">
</head>
<body>
  <a class="sr-only skip-link" href="#main">Skip to content</a>

  <div class="app">

    <div class="shell">

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
          <span class="brand-name">CHECK&nbsp;BOX</span>
        </div>

        <nav class="topnav" role="tablist" aria-label="Sections">
          <button class="tab-btn active" id="tab-work" role="tab" aria-selected="true" data-tab="work">Dashboard</button>
          <button class="tab-btn" id="tab-analytics" role="tab" aria-selected="false" data-tab="analytics">Analytics</button>
          <button class="tab-btn" id="tab-habits" role="tab" aria-selected="false" data-tab="habits">Habits</button>
          <button class="tab-btn" id="tab-projects" role="tab" aria-selected="false" data-tab="projects">Projects</button>
          <button class="tab-btn" id="tab-schedule" role="tab" aria-selected="false" data-tab="schedule">Schedule</button>
          <button class="tab-btn" id="tab-settings" role="tab" aria-selected="false" data-tab="settings">Settings</button>
        </nav>

        <div class="topbar-right">
          <button class="btn-rearrange" id="btn-rearrange" title="Toggle Rearrange Mode">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
            <span id="rearrange-label">Rearrange</span>
          </button>
          <div class="topbar-streak" title="12 Day Task Streak!">
            <span>🔥</span>
            <span>12 Days</span>
          </div>
          <button class="topbar-icon-btn" id="btn-notifications" title="Notifications">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="badge-dot"></span>
          </button>
          <span class="clock"><span class="clock-dot"></span><span id="today"></span></span>
          <span class="timer-pill" id="topbar-timer" hidden title="Active timer">
            <span class="timer-dot"></span><span class="timer-name" id="topbar-timer-name"></span><span class="timer-sep">&#183;</span><span id="topbar-timer-val">0:00</span>
          </span>
          <div class="new-wrap">
            <button class="new-btn" id="new-btn" aria-haspopup="true" aria-expanded="false" aria-controls="new-menu" title="Add something" aria-label="Add something">+</button>
            <div class="new-menu" id="new-menu" role="menu" aria-label="Create a new entry" hidden>
              <button class="new-item" role="menuitem" data-qatype="project">+ Project</button>
              <button class="new-item" role="menuitem" data-qatype="task">+ Task</button>
              <button class="new-item" role="menuitem" data-qatype="learning">+ Learning</button>
              <button class="new-item" role="menuitem" data-qatype="goal">+ Goal</button>
              <button class="new-item" role="menuitem" data-qatype="journal">+ Journal</button>
            </div>
          </div>
        </div>
      </header>

      <main id="main" class="main">

        <!-- DASHBOARD / WORK PANEL -->
        <section id="panel-work" class="tab-panel active" role="tabpanel" aria-labelledby="tab-work">

          <!-- Greeting & Metric Summary Banner -->
          <div class="greeting-banner">
            <div class="greeting-header-row">
              <div>
                <div id="greeting-text" class="greeting-title">Good morning</div>
                <div id="greeting-name" class="greeting-title greeting-name-title">Alex ☀️</div>
                <p id="current-date-str" class="greeting-date">Tuesday, August 11, 2026</p>
              </div>
              <div class="metrics-pills-row">
                <div class="metric-pill-item dark"><span>Completed</span><span class="metric-pill-val" id="metric-completed">65%</span></div>
                <div class="metric-pill-item amber"><span>Deep Work</span><span class="metric-pill-val" id="metric-deep-work">4.5h</span></div>
                <div class="metric-pill-item"><span>Daily Habits</span><span class="metric-pill-val" id="metric-habits">80%</span></div>
                <div class="metric-pill-item"><span>To Do</span><span class="metric-pill-val" id="metric-todo">3</span></div>
              </div>
            </div>
            <div class="metrics-key-row">
              <div class="key-metric"><div class="key-metric-icon">✓</div><div><div class="key-metric-num" id="keymetric-tasks">8</div><div class="key-metric-lbl">Today's Tasks</div></div></div>
              <div class="key-metric"><div class="key-metric-icon">📁</div><div><div class="key-metric-num" id="keymetric-projects">4</div><div class="key-metric-lbl">Active Projects</div></div></div>
              <div class="key-metric"><div class="key-metric-icon">⚡</div><div><div class="key-metric-num" id="keymetric-focus">88%</div><div class="key-metric-lbl">Focus Score</div></div></div>
            </div>
          </div>

          <!-- ROW 1: TOP FOCUS & TASK CARDS -->
          <div class="widgets-grid-4">
            <div class="widget-part" data-part="current-task"></div>
            <div class="widget-part" data-part="focus-timer"></div>
            <div class="widget-part" data-part="analytics"></div>
            <div class="widget-part" data-part="tasks"></div>
          </div>

          <!-- ROW 2: WORK FOCUS (MIND MAP & UPCOMING / IDEAS) -->
          <div class="work-layout">
            <div class="widget-part" data-part="mind-map"></div>
            <div class="work-side">
              <div class="widget-part" data-part="upcoming"></div>
              <div class="widget-part" data-part="ideas"></div>
            </div>
          </div>

          <!-- ROW 3: PERSONAL TRACKERS & SCHEDULE GRID -->
          <div class="widgets-grid-2">
            <div class="side-stack">
              <div class="widget-part" data-part="habits"></div>
              <div class="widget-part" data-part="projects-overview"></div>
              <div class="widget-part" data-part="notes"></div>
            </div>
            <div class="widget-part" data-part="schedule"></div>
          </div>

        </section>

        <!-- ANALYTICS PANEL -->
        <section id="panel-analytics" class="tab-panel" role="tabpanel" aria-labelledby="tab-analytics">
          <div class="widgets-grid-2">
            <div class="widget-part" data-part="analytics"></div>
            <div class="widget-part" data-part="focus-timer"></div>
          </div>
        </section>

        <!-- HABITS PANEL -->
        <section id="panel-habits" class="tab-panel" role="tabpanel" aria-labelledby="tab-habits">
          <div class="widgets-grid-2">
            <div class="widget-part" data-part="habits"></div>
            <div class="widget-part" data-part="notes"></div>
          </div>
        </section>

        <!-- PROJECTS PANEL -->
        <section id="panel-projects" class="tab-panel" role="tabpanel" aria-labelledby="tab-projects">
          <div class="widgets-grid-2">
            <div class="widget-part" data-part="projects-overview"></div>
            <div class="widget-part" data-part="ideas"></div>
          </div>
        </section>

        <!-- SCHEDULE PANEL -->
        <section id="panel-schedule" class="tab-panel" role="tabpanel" aria-labelledby="tab-schedule">
          <div class="widget-part" data-part="schedule"></div>
        </section>

        <!-- SETTINGS PANEL -->
        <section id="panel-settings" class="tab-panel" role="tabpanel" aria-labelledby="tab-settings">
          <div class="settings-layout">
            <div class="widget-part" data-part="settings"></div>
          </div>
        </section>

      </main>

    </div>
  </div>

  <div class="widget-part" data-part="quick-add"></div>
  <div class="widget-part" data-part="sessions"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="widgets/mind-map/widget.js"></script>
  <script src="widgets/current-task/widget.js"></script>
  <script src="widgets/upcoming/widget.js"></script>
  <script src="widgets/tasks/widget.js"></script>
  <script src="widgets/ideas/widget.js"></script>
  <script src="widgets/settings/widget.js"></script>
  <script src="widgets/quick-add/widget.js"></script>
  <script src="widgets/sessions/widget.js"></script>
  <script src="widgets/focus-timer/widget.js"></script>
  <script src="widgets/analytics/widget.js"></script>
  <script src="widgets/habits/widget.js"></script>
  <script src="widgets/projects-overview/widget.js"></script>
  <script src="widgets/schedule/widget.js"></script>
  <script src="widgets/notes/widget.js"></script>
  <script src="main.js"></script>
</body>
</html>
