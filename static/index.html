<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECK BOX — Life at a glance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23AAEB47'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 6' fill='none' stroke='%23111111' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="sr-only skip-link" href="#main">Skip to content</a>

  <div class="app">

    <nav class="sidebar" aria-label="Primary">
      <button class="side-icon active" data-tab="work" aria-label="Work" title="Work">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button class="side-icon" data-tab="projects" aria-label="Projects" title="Projects">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="side-icon" data-tab="goals" aria-label="Goals" title="Goals">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      </button>
      <button class="side-icon" data-tab="knowledge" aria-label="Knowledge" title="Knowledge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      </button>
      <button class="side-icon" data-tab="timeline" aria-label="Timeline" title="Timeline">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
      </button>
    </nav>

    <div class="shell">

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
          <span class="brand-name">CHECK&nbsp;BOX</span>
        </div>

        <nav class="topnav" role="tablist" aria-label="Sections">
          <button class="tab-btn active" id="tab-work" role="tab" aria-selected="true" data-tab="work">Work</button>
          <button class="tab-btn" id="tab-projects" role="tab" aria-selected="false" data-tab="projects">Projects</button>
          <button class="tab-btn" id="tab-goals" role="tab" aria-selected="false" data-tab="goals">Goals</button>
          <button class="tab-btn" id="tab-knowledge" role="tab" aria-selected="false" data-tab="knowledge">Knowledge</button>
          <button class="tab-btn" id="tab-timeline" role="tab" aria-selected="false" data-tab="timeline">Timeline</button>
        </nav>

        <div class="topbar-right">
          <span class="clock"><span class="clock-dot"></span><span id="today"></span></span>
          <div class="new-wrap">
            <button class="new-btn" id="new-btn" aria-haspopup="true" aria-expanded="false" aria-controls="new-menu" title="Add something" aria-label="Add something">+</button>
            <div class="new-menu" id="new-menu" role="menu" aria-label="Create a new entry" hidden>
              <button class="new-item" role="menuitem" data-qatype="project">+ Project</button>
              <button class="new-item" role="menuitem" data-qatype="task">+ Task</button>
              <button class="new-item" role="menuitem" data-qatype="learning">+ Learning</button>
              <button class="new-item" role="menuitem" data-qatype="goal">+ Goal</button>
              <button class="new-item" role="menuitem" data-qatype="journal">+ Journal</button>
            </div>
          </div>
        </div>
      </header>

      <div class="subheader">
        <h1 class="page-title" id="page-title">Work</h1>
        <div class="sub-filters">
          <div class="filter-group" id="sub-project-filters" hidden>
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="active">Active</button>
            <button class="filter-pill" data-filter="backlog">Backlog</button>
            <button class="filter-pill" data-filter="done">Done</button>
            <button class="filter-pill" data-filter="paused">Paused</button>
          </div>
        </div>
      </div>

      <main id="main" class="main">

        <section id="panel-work" class="tab-panel active" role="tabpanel" aria-labelledby="tab-work">

          <div class="work-layout">

            <section class="card work-hero-card">
              <div class="card-head">
                <h3 class="card-label">Current Task</h3>
                <span class="overflow" aria-hidden="true">&#8943;</span>
              </div>
              <div id="work-current"></div>
            </section>

            <section class="card work-card">
              <div class="card-head">
                <h3 class="card-label">Upcoming</h3>
                <span class="overflow" aria-hidden="true">&#8943;</span>
              </div>
              <div id="work-upcoming"></div>
            </section>

            <div class="work-cols">
              <section class="card work-card">
                <div class="card-head">
                  <h3 class="card-label">Projects <span class="mono-mute" id="work-projects-count"></span></h3>
                  <span class="overflow" aria-hidden="true">&#8943;</span>
                </div>
                <div id="work-projects"></div>
              </section>

              <section class="card work-card">
                <div class="card-head">
                  <h3 class="card-label">Ideas</h3>
                  <button class="btn btn-sm" id="work-new-idea" data-action="new-idea">+ New</button>
                </div>
                <div id="work-ideas"></div>
              </section>
            </div>

          </div>

        </section>

        <section id="panel-projects" class="tab-panel" role="tabpanel" aria-labelledby="tab-projects">
          <div class="panel span-12 project-tree-panel">
            <div class="panel-head-row"><h3>Project Tree</h3></div>
            <div class="tree-list" id="project-tree"></div>
          </div>
          <div class="dash-grid">
            <div class="panel span-6">
              <div class="panel-head-row"><h3>By Status</h3></div>
              <div id="projects-status"></div>
            </div>
            <div class="panel span-6">
              <div class="panel-head-row"><h3>By Priority</h3></div>
              <div id="projects-priority"></div>
            </div>
          </div>
          <div class="projects-cols" id="projects-cols"></div>
        </section>

        <section id="panel-goals" class="tab-panel" role="tabpanel" aria-labelledby="tab-goals">
          <div class="dash-grid">
            <div class="panel span-12">
              <div class="panel-head-row"><h3>Progress by Area</h3></div>
              <div id="goals-area-chart"></div>
            </div>
          </div>
          <div id="goals-list"></div>
        </section>

        <section id="panel-knowledge" class="tab-panel" role="tabpanel" aria-labelledby="tab-knowledge">
          <div class="dash-grid">
            <div class="panel span-6">
              <div class="panel-head-row"><h3>Top Tags</h3></div>
              <div id="knowledge-tags"></div>
            </div>
            <div class="panel span-6">
              <div class="panel-head-row"><h3>Learnings Over Time</h3></div>
              <div class="chart-box" id="knowledge-trend"></div>
            </div>
          </div>
          <div class="filter-row">
            <label class="sr-only" for="learn-tag-filter">Filter learnings by tag</label>
            <input class="input" id="learn-tag-filter" type="text" placeholder="Filter by tag..." autocomplete="off">
            <label class="sr-only" for="learn-date-filter">Filter learnings by date</label>
            <input class="input" id="learn-date-filter" type="date">
            <button class="btn btn-sm" id="learn-filter-clear">Clear</button>
          </div>
          <div id="learn-list"></div>
        </section>

        <section id="panel-timeline" class="tab-panel" role="tabpanel" aria-labelledby="tab-timeline">
          <div class="panel-head">
            <h2 class="panel-h2">Timeline</h2>
            <span class="muted" id="timeline-count"></span>
          </div>
          <div class="dash-grid">
            <div class="panel span-12">
              <div class="panel-head-row"><h3>Monthly Activity</h3></div>
              <div id="timeline-monthly"></div>
            </div>
          </div>
          <div class="timeline" id="timeline-list"></div>
        </section>

      </main>

      <footer class="site-footer">
        <span>CHECK BOX &middot; Your life, one glance at a time.</span>
      </footer>

    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Quick Add</h2>
        <button class="btn-icon" id="modal-close" data-close aria-label="Close">&#215;</button>
      </div>
      <form id="quick-form">
        <div class="field">
          <label for="qa-type">Type</label>
          <select class="input" id="qa-type" name="type">
            <option value="project">Project</option>
            <option value="task">Task</option>
            <option value="learning">Learning</option>
            <option value="goal">Goal</option>
            <option value="journal">Journal</option>
          </select>
        </div>
        <div id="qa-fields"></div>
        <div class="modal-actions">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="sessions-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sessions-title">
      <div class="modal-head">
        <h2 id="sessions-title">Sessions</h2>
        <button class="btn-icon" data-action="session-close" aria-label="Close">&#215;</button>
      </div>
      <div id="sessions-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
