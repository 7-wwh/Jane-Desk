
<style>
*{box-sizing:border-box;margin:0;padding:0}
.mm-shell{font-family:var(--font-sans);padding:0 0 2rem}
.mm-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 1rem}
.mm-title{font-size:13px;font-weight:500;color:var(--text-secondary);letter-spacing:.06em;text-transform:uppercase}
.mm-count{font-size:12px;color:var(--text-muted);margin-left:6px}
.mm-actions{display:flex;gap:6px}
.mm-btn{font-size:12px;color:var(--text-secondary);background:none;border:0.5px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;transition:background .15s,color .15s}
.mm-btn:hover{background:var(--surface-1);color:var(--text-primary)}

.mm-canvas{position:relative;overflow:hidden;background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;cursor:grab;height:420px}
.mm-canvas.panning{cursor:grabbing}

.mm-wrap{position:absolute;top:0;left:0;transform-origin:0 0}
.mm-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}

.mn{
  position:absolute;transform:translateY(-50%);
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;
  border:0.5px solid var(--border);
  background:var(--surface-2);
  color:var(--text-secondary);
  font-size:12px;font-weight:400;
  white-space:nowrap;
  transition:border-color .12s,background .12s,color .12s;
  cursor:pointer;
  pointer-events:all;
}
.mn:hover{border-color:var(--border-strong);color:var(--text-primary)}

.mn.root{
  background:var(--text-primary);color:var(--surface-2);
  border-color:var(--text-primary);
  font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 16px;
}
.mn.branch{
  background:var(--surface-1);border-color:var(--border-strong);
  color:var(--text-secondary);
  font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
}
.mn.branch:hover{border-color:var(--border-stronger);color:var(--text-primary)}
.mn.task{font-size:11px;color:var(--text-muted)}
.mn.task:hover{color:var(--text-secondary)}
.mn.done{color:var(--text-success);border-color:var(--border-success)}
.mn.in_progress{color:var(--text-primary);border-color:var(--border-stronger);font-weight:500}
.mn.paused,.mn.backlog{color:var(--text-muted)}
.mn.running{border-color:var(--border-accent);color:var(--text-accent);font-weight:500;box-shadow:0 0 0 3px var(--bg-accent)}

.mn-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;
  background:var(--surface-0);border:0.5px solid var(--border);
  color:var(--text-muted);font-size:9px;flex-shrink:0;
  transition:transform .2s;
}
.mn.open .mn-toggle{transform:rotate(90deg)}

.mn-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--border-strong)}
.mn.done .mn-dot{background:var(--fill-success)}
.mn.in_progress .mn-dot{background:var(--fill-accent)}
.mn.running .mn-dot{background:var(--fill-accent)}
.mn.paused .mn-dot,.mn.backlog .mn-dot{background:var(--border)}

.me{fill:none;stroke:var(--border-strong);stroke-width:1;opacity:.6}
.mm-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted);background:var(--surface-2);border:0.5px solid var(--border);border-radius:6px;padding:4px 10px;pointer-events:none;opacity:.7;white-space:nowrap}
</style>

<div class="mm-shell">
  <h2 class="sr-only">Mind map showing work projects and tasks</h2>
  <div class="mm-header">
    <div>
      <span class="mm-title">Mind map</span>
      <span class="mm-count" id="mm-count"></span>
    </div>
    <div class="mm-actions">
      <button class="mm-btn" onclick="resetView()">Reset view</button>
    </div>
  </div>
  <div class="mm-canvas" id="canvas">
    <div class="mm-wrap" id="wrap">
      <svg class="mm-svg" id="svg-layer"></svg>
    </div>
    <div class="mm-hint">Scroll to zoom · drag to pan · click nodes to expand</div>
  </div>
</div>

<script>
const TREE = {
  label:"WORK", kind:"root", key:"root",
  children:[
    {label:"Design", kind:"branch", key:"b:design", children:[
      {label:"Brand refresh", kind:"project", status:"in_progress", running:true, key:"p:1",
        children:[
          {label:"Audit existing assets", kind:"task", status:"done", key:"t:1"},
          {label:"New color system", kind:"task", status:"in_progress", running:true, key:"t:2"},
          {label:"Typography scale", kind:"task", status:"backlog", key:"t:3"},
        ]},
      {label:"Icon library", kind:"project", status:"done", key:"p:2",
        children:[
          {label:"Export all SVGs", kind:"task", status:"done", key:"t:4"},
          {label:"Upload to Figma", kind:"task", status:"done", key:"t:5"},
        ]},
    ]},
    {label:"Engineering", kind:"branch", key:"b:eng", children:[
      {label:"API v3 migration", kind:"project", status:"in_progress", key:"p:3",
        children:[
          {label:"Schema design", kind:"task", status:"done", key:"t:6"},
          {label:"Auth endpoints", kind:"task", status:"in_progress", key:"t:7"},
          {label:"Rate limiting", kind:"task", status:"paused", key:"t:8"},
          {label:"Write tests", kind:"task", status:"backlog", key:"t:9"},
        ]},
      {label:"Dashboard perf", kind:"project", status:"paused", key:"p:4",
        children:[
          {label:"Profile renders", kind:"task", status:"done", key:"t:10"},
          {label:"Lazy load charts", kind:"task", status:"paused", key:"t:11"},
        ]},
    ]},
    {label:"Research", kind:"branch", key:"b:research", children:[
      {label:"User interviews", kind:"project", status:"in_progress", key:"p:5",
        children:[
          {label:"Recruit participants", kind:"task", status:"done", key:"t:12"},
          {label:"Run sessions (5/8)", kind:"task", status:"in_progress", key:"t:13"},
          {label:"Synthesise findings", kind:"task", status:"backlog", key:"t:14"},
        ]},
    ]},
  ]
};

const GAP_X=200, GAP_Y=40;
let expanded=new Set(["root","b:design","b:eng","b:research","p:1"]);
let zoom=1, pan={x:60,y:60};
let panStart=null, panMoved=false;

function findNode(n,k){if(n.key===k)return n;for(const c of n.children||[]){const f=findNode(c,k);if(f)return f;}return null}
function countProj(n){let c=0;if(n.kind==="project")c++;(n.children||[]).forEach(ch=>c+=countProj(ch));return c;}

function layout(root){
  let slot=0;const placed=[];
  function place(n,depth){
    const hasKids=(n.children||[]).length>0&&expanded.has(n.key);
    n._x=depth*GAP_X;
    if(!hasKids){n._y=slot*GAP_Y;n._top=n._bot=n._y;slot++;}
    else{(n.children||[]).forEach(c=>place(c,depth+1));n._top=n.children[0]._top;n._bot=n.children[n.children.length-1]._bot;n._y=(n._top+n._bot)/2;}
    placed.push(n);
  }
  place(root,0);
  return{placed,h:Math.max(1,slot)*GAP_Y+60};
}

function bezier(x1,y1,x2,y2){const dx=(x2-x1)*0.45;return`M${x1} ${y1} C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`}

function render(){
  const{placed,h}=layout(TREE);
  const wrap=document.getElementById("wrap");
  const svgEl=document.getElementById("svg-layer");

  // Remove old nodes
  [...wrap.querySelectorAll(".mn")].forEach(el=>el.remove());

  // Insert nodes
  let html="";
  placed.forEach(n=>{
    const open=expanded.has(n.key);
    const kids=(n.children||[]).length;
    const cls=["mn",n.kind,n.status||"",n.running?"running":"",open&&kids?"open":""].filter(Boolean).join(" ");
    const dot=(n.kind==="project"||n.kind==="task")?`<span class="mn-dot"></span>`:"";
    const toggle=kids?`<span class="mn-toggle">›</span>`:"";
    html+=`<div class="${cls}" data-key="${n.key}" style="left:${Math.round(n._x)}px;top:${Math.round(n._y)}px">${dot}<span>${n.label}</span>${toggle}</div>`;
  });
  wrap.insertAdjacentHTML("beforeend",html);

  // Measure widths
  const nodeEls=[...wrap.querySelectorAll(".mn")];
  let maxR=0;
  placed.forEach((n,i)=>{n._w=nodeEls[i]?nodeEls[i].offsetWidth||100:100;maxR=Math.max(maxR,n._x+n._w);});

  const W=Math.round(maxR+40),H=Math.round(h);
  wrap.style.width=W+"px";wrap.style.height=H+"px";
  svgEl.setAttribute("width",W);svgEl.setAttribute("height",H);
  svgEl.setAttribute("viewBox",`0 0 ${W} ${H}`);

  // Edges
  const edges=[];
  function collectEdges(n){
    if(!expanded.has(n.key))return;
    (n.children||[]).forEach(c=>{edges.push({x1:n._x+n._w,y1:n._y,x2:c._x,y2:c._y});collectEdges(c);});
  }
  collectEdges(TREE);
  svgEl.innerHTML=edges.map(e=>`<path d="${bezier(e.x1,e.y1,e.x2,e.y2)}" class="me"/>`).join("");

  document.getElementById("mm-count").textContent=`${countProj(TREE)} projects`;
}

function applyPan(){
  const wrap=document.getElementById("wrap");
  if(wrap) wrap.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
}

function resetView(){
  const canvas=document.getElementById("canvas");
  pan={x:60,y:Math.max(20,(canvas.clientHeight/zoom-300)/2)};
  zoom=1;applyPan();
}

// ── Interaction ──────────────────────────────────────────────────────────────
const canvas=document.getElementById("canvas");

// Track pointer distance to distinguish click from drag
let pointerDownPos=null;

canvas.addEventListener("pointerdown", e=>{
  if(e.button!==0)return;
  pointerDownPos={x:e.clientX,y:e.clientY};
  panMoved=false;
  panStart={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor="grabbing";
});

canvas.addEventListener("pointermove", e=>{
  if(!panStart)return;
  const dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
  if(Math.hypot(dx,dy)>4) panMoved=true;
  if(panMoved){
    pan.x=panStart.px+dx;
    pan.y=panStart.py+dy;
    applyPan();
  }
});

canvas.addEventListener("pointerup", e=>{
  if(!panStart)return;
  const wasDrag=panMoved;
  panStart=null;
  canvas.style.cursor="grab";

  if(!wasDrag){
    // It's a real click — find the node
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const nodeEl=el&&el.closest(".mn");
    if(nodeEl){
      const k=nodeEl.dataset.key;
      const n=findNode(TREE,k);
      if(n&&(n.children||[]).length){
        if(expanded.has(k)) expanded.delete(k);
        else expanded.add(k);
        render();
        applyPan();
      }
    }
  }
});

canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  const factor=e.deltaY<0?1.1:1/1.1;
  const old=zoom;
  zoom=Math.min(3,Math.max(0.25,old*factor));
  pan.x=cx-(cx-pan.x)*(zoom/old);
  pan.y=cy-(cy-pan.y)*(zoom/old);
  applyPan();
},{passive:false});

canvas.addEventListener("dblclick", e=>{
  if(e.target.closest(".mn"))return;
  resetView();
});

render();
setTimeout(()=>{resetView();render();applyPan();},80);
</script>
